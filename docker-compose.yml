services:
  api:
    build:
      context: ..
      dockerfile: researcher_agent/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  ui:
    build:
      context: ..
      dockerfile: researcher_agent/Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      - RESEARCH_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
